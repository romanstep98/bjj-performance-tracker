name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check diary data logic
        run: node tests/smoke.cjs
      - name: Check backup byte I/O and durable staging
        run: |
          javac -d /tmp/bjj-backup-tests app/src/main/java/cz/builttoroll/app/BackupFiles.java tests/BackupFilesTest.java
          java -cp /tmp/bjj-backup-tests cz.builttoroll.app.BackupFilesTest
      - name: Build and lint
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BUILT-TO-ROLL-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
