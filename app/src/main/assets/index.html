const icons={home:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2m4 0h2"/>',plus:'<path d="M12 5v14M5 12h14"/>',stats:'<path d="M4 20V10m8 10V4m8 16v-7"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',cup:'<path d="M8 3h8v6a4 4 0 01-8 0V3zm0 2H4v2a4 4 0 004 4m8-6h4v2a4 4 0 01-4 4m-4 2v6m-4 2h8"/>',strength:'<path d="M6 5v14m12-14v14M3 8v8m18-8v8M6 12h12"/>',moon:'<path d="M20 15a9 9 0 01-11-11 9 9 0 1011 11z"/>',bolt:'<path d="M13 2L4 14h7l-1 8 10-13h-7z"/>',bjj:'<path d="M8 3l4 3 4-3 5 6-4 3-1 9H8l-1-9-4-3 5-6zm1 0l6 12M15 3L9 15m-2 0h10"/>',arrow:'<path d="M5 12h14m-5-5l5 5-5 5"/>',check:'<path d="M5 12l4 4L19 6"/>',chat:'<path d="M21 11a8 8 0 01-8 8H6l-4 3V11a9 9 0 0119 0z"/><path d="M7 10h10m-10 4h7"/>',download:'<path d="M12 3v12m-5-5l5 5 5-5M4 17v4h16v-4"/>',heart:'<path d="M20 5c-3-3-7-1-8 1-1-2-5-4-8-1-5 5 8 15 8 15s13-10 8-15z"/>'};

const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>iso(),add=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)},diff=(a,b)=>Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5),week=s=>add(s,-((new Date(s+'T12:00:00').getDay()+6)%7)),fmt=(s,opt={day:'numeric',month:'long'})=>new Date(s+'T12:00:00').toLocaleDateString('cs-CZ',opt),avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,num=(n,d=0)=>Number(n).toLocaleString('cs-CZ',{maximumFractionDigits:d}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9),clone=x=>JSON.parse(JSON.stringify(x));

const types=['BJJ No-Gi','BJJ Gi','BJJ Open Mat','Silový trénink','Kondiční trénink','Běh','Mobilita','Strečink','Regenerace','Aktivní regenerace','Volno','Turnaj nebo závod','Ostatní'];

function isBjj(type){return ['BJJ No-Gi','BJJ Gi','BJJ Open Mat'].includes(type);}
function activityLabel(e){return e.type==='Ostatní'&&e.customActivity?'Ostatní · '+e.customActivity:e.type;}
function migrateActivities(b){if(!b||!Array.isArray(b.sessions))return b;if(b.weights===undefined)b.weights=[];const legacy={'BJJ – technika':'BJJ Gi','BJJ – sparring':'BJJ Gi','BJJ – drilling':'BJJ Gi','BJJ – open mat':'BJJ Open Mat','No-Gi grappling':'BJJ No-Gi','Vlastní aktivita':'Ostatní'};for(const e of b.sessions){if(!e||typeof e!=='object')continue;const old=e.type;if(legacy[old]){e.legacyType=e.legacyType||old;e.type=legacy[old];}if(e.type==='Ostatní'&&!e.customActivity)e.customActivity=typeof e.title==='string'&&e.title.trim()?e.title:'Vlastní aktivita';if(isBjj(e.type)&&e.hasSparring===undefined)e.hasSparring=old==='BJJ – sparring'||Number(e.rounds||0)>0;}return b;}
function tint(t){return colors[types.indexOf(t)]||'#ff7547'}function sporticon(t){return t==='Silový trénink'?'strength':/BJJ|No-Gi/.test(t)?'bjj':t==='Volno'?'moon':'bolt'}
function emptyDiary(){return {version:1,demo:false,profile:{name:'Roman',sleepGoal:8,goal:'',belt:'Bílý'},sessions:[],sleep:[],checks:[],tournaments:[],weights:[]};}
function seed(){let sessions=[],sleep=[],checks=[];for(let i=27;i>=0;i--){let date=add(today(),-i);sleep.push({id:uid(),date,start:'23:00',end:i%3?'07:00':'06:30',hours:i%3?8:7.5,quality:7+i%2});checks.push({id:uid(),date,energy:7+i%2,soreness:3+i%3,fatigue:3+i%3,stress:3,motivation:8,rested:7});if(i&&i%4!==0){let strength=i%3===0;sessions.push({id:uid(),date,start:strength?'07:00':'18:00',end:strength?'08:00':'19:30',duration:strength?60:90,type:strength?'Silový trénink':i%2?'BJJ No-Gi':'BJJ Gi',title:strength?'Síla celého těla':i%2?'Technika · guard passing':'BJJ · poziční sparring',rpe:strength?6:i%2?6:8,status:'done',hasSparring:!strength&&i%2===0,rounds:!strength&&i%2===0?5:0,roundMinutes:5,notes:'',techniques:strength?'':'Knee cut, kontrola side control',sets:strength?[...Array.from({length:3},()=>({exercise:'Dřep',reps:5,weight:75+(27-i),effort:7,mode:'RPE',notes:'',exerciseNotes:'Plynulý pohyb, pevný střed.'})),{exercise:'Shyby',reps:8,weight:0,effort:2,mode:'RIR',notes:'Bez švihu.'},...Array.from({length:3},()=>({exercise:'Bench press',reps:6,weight:65,effort:7.5,mode:'RPE',notes:''}))]:[]});}}
 sessions.push({id:uid(),date:today(),start:'18:00',end:'19:30',duration:90,type:'BJJ Gi',hasSparring:true,rounds:5,roundMinutes:5,title:'BJJ · technika a sparring',rpe:8,status:'planned',notes:'Zaměřit se na udržení pozice po přechodu guardu.',techniques:'Knee cut, side control',sets:[]},{id:uid(),date:today(),start:'20:00',end:'20:20',duration:20,type:'Mobilita',title:'Mobilita · kyčle a ramena',rpe:3,status:'planned',notes:'Lehce, bez bolesti.',sets:[]});for(let i=1;i<9;i++)if(i%3!==0)sessions.push({id:uid(),date:add(today(),i),start:i%2?'18:00':'07:00',end:i%2?'19:30':'08:00',duration:i%2?90:60,type:i%2?'BJJ Gi':'Silový trénink',title:i%2?'BJJ · drilling a technika':'Síla · celé tělo',rpe:6,status:'planned',notes:'',sets:[]});return {version:1,demo:true,weights:Array.from({length:14},(_,i)=>({id:uid(),date:add(today(),i-13),time:'07:00',kg:Math.round((83-(i*.08)+(i%3)*.1)*100)/100,notes:'Ukázkové ranní vážení'})),profile:{name:'Jakub',sleepGoal:8,goal:'Zlepšit se na žíněnce. Zůstat zdravý.',belt:'Modrý'},sessions,sleep,checks,tournaments:[{id:uid(),name:'Prague BJJ Open',date:add(today(),59),place:'Praha · sportovní hala',priority:'A',main:true,weightCategory:'do 79,3 kg',targetWeight:79.3,weightGoalMode:'limit',notes:'Hlavní cíl sezóny. Gi kategorie.'}]};}

const setUnits={reps:{label:'Opakování',short:'opak.',max:1000,step:1},seconds:{label:'Čas (s)',short:'s',max:86400,step:'any'},meters:{label:'Vzdálenost (m)',short:'m',max:100000,step:'any'}};
const KEY='bjj-performance-html-beta-v1';let db,storage=true,storageLocked=false,savedRaw=null;
try{savedRaw=localStorage.getItem(KEY);db=savedRaw!==null?validate(JSON.parse(savedRaw)):emptyDiary();}catch(e){db=seed();storage=false;storageLocked=savedRaw!==null;}
function save(){if(storageLocked){storage=false;}else{try{localStorage.setItem(KEY,JSON.stringify(db));storage=true;}catch(e){storage=false;}}let warning=$('#storagewarn');warning.hidden=storage;warning.innerHTML=storageLocked?'Původní deník nelze načíst. Zobrazuje se neukládaná ukázka; původní data nepřepisujeme. Obnov platnou zálohu v Profilu. <button class="btn small" data-action="recover-raw">Stáhnout původní data</button>':'Prohlížeč nepovoluje místní ukládání nebo je úložiště plné. Změny jsou jen pro toto otevření stránky. Použij Export JSON.';return storage;}

// Legacy sets omit unit and remain repetitions. Numeric values stay in reps
// for lossless compatibility with existing diaries; unit defines their meaning.
function setUnit(x){return x.unit===undefined?'reps':x.unit;}
function validSetQuantity(x){let u=setUnit(x),cfg=setUnits[u];return !!cfg&&finite(x.reps,0,cfg.max)&&(u!=='reps'||Number.isInteger(x.reps));}
function setQuantity(x){return num(x.reps,2)+' '+setUnits[setUnit(x)].short;}
function exerciseSummary(sets){return groupSets(sets).map(g=>{let first=g.sets[0],same=g.sets.every(x=>x.reps===first.reps&&setUnit(x)===setUnit(first));return g.name+' · '+(same?g.sets.length+' × '+setQuantity(first):g.sets.map(setQuantity).join(' / '));}).join(' · ');}
function strengthAmounts(sets){let parts=[],reps=sets.filter(x=>setUnit(x)==='reps'),seconds=sets.filter(x=>setUnit(x)==='seconds'),meters=sets.filter(x=>setUnit(x)==='meters');if(reps.length)parts.push(num(reps.reduce((total,x)=>total+(x.loadMode==='assistance'?0:x.reps*x.weight),0),1)+' kg objem');if(seconds.length)parts.push(num(seconds.reduce((total,x)=>total+x.reps,0),2)+' s');if(meters.length)parts.push(num(meters.reduce((total,x)=>total+x.reps,0),2)+' m');return parts.join(' · ')||'Bez sérií';}

function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s+'T12:00:00'))&&iso(new Date(s+'T12:00:00'))===s}function finite(n,a,b){return typeof n==='number'&&Number.isFinite(n)&&n>=a&&n<=b}function validate(b){validateExtensionData(b);migrateActivities(b);if(!b||b.version!==1||!b.profile||typeof b.profile.name!=='string'||!finite(b.profile.sleepGoal,1,24)||!['sessions','sleep','checks','tournaments','weights'].every(k=>Array.isArray(b[k])&&b[k].length<20000))throw Error('Neplatný formát zálohy.');let ids=new Set(),dailyIds=new Set();for(const key of ['sessions','sleep','checks','tournaments','weights'])for(const e of b[key]){if(typeof e.id!=='string'||ids.has(e.id)||!validDate(e.date))throw Error('Neplatný záznam nebo duplicitní ID.');ids.add(e.id);if(['sleep','checks'].includes(key)){const daily=key+e.date;if(dailyIds.has(daily))throw Error('Záloha obsahuje duplicitní denní záznam.');dailyIds.add(daily);}if(key==='sessions'&&(!types.includes(e.type)||!finite(e.duration,0,1440)||!finite(e.rpe,1,10)||!['planned','done','skipped'].includes(e.status)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(e.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(e.end)||typeof e.title!=='string'||!Array.isArray(e.sets||[])))throw Error('Neplatný trénink.');if(key==='sessions'&&e.type==='Ostatní'&&(typeof e.customActivity!=='string'||!e.customActivity.trim()||e.customActivity.length>120))throw Error('Doplň vlastní název aktivity.');if(key==='sessions'&&e.hasSparring!==undefined&&typeof e.hasSparring!=='boolean')throw Error('Neplatná volba sparringu.');if(key==='sessions')for(const s of e.sets||[])if(typeof s.exercise!=='string'||!validSetQuantity(s)||!finite(s.weight,0,2000)||(s.effort!==undefined&&!finite(s.effort,s.mode==='RIR'?0:1,10))||(s.mode!==undefined&&!['RPE','RIR'].includes(s.mode))||(s.notes!==undefined&&typeof s.notes!=='string')||(s.exerciseNotes!==undefined&&typeof s.exerciseNotes!=='string'))throw Error('Neplatná série.');if(key==='sleep'&&(!finite(e.hours,0,24)||!finite(e.quality,1,10)))throw Error('Neplatný spánek.');if(key==='checks'&&e.painLevel!==undefined&&!finite(e.painLevel,0,10))throw Error('Neplatná intenzita bolesti.');if(key==='sessions'&&e.rounds!==undefined&&(!finite(e.rounds,0,100)||!Number.isInteger(e.rounds)||!finite(e.roundMinutes,0,60)))throw Error('Neplatný sparring.');if(key==='checks'&&!['energy','soreness','fatigue','stress','motivation','rested'].every(k=>finite(e[k],1,10)))throw Error('Neplatný ranní stav.');if(key==='weights'&&(!finite(e.kg,1,500)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(e.time)))throw Error('Hmotnost musí být 1–500 kg a čas HH:MM.');if(key==='tournaments'&&e.targetWeight!==undefined&&(!finite(e.targetWeight,1,500)||!['target','limit'].includes(e.weightGoalMode||'target')))throw Error('Neplatný váhový cíl turnaje.');if(key==='tournaments'&&(typeof e.name!=='string'||!['A','B','C'].includes(e.priority)))throw Error('Neplatný turnaj.');}return b}
let route='home',calDate=today(),calMode='Týden',period=7,metric='Zátěž',targetMode='Nejbližší',toastTimer;
const navs=[['home','Přehled','home'],['calendar','Kalendář','calendar'],['add','Přidat','plus'],['history','Deník','stats'],['profile','Profil','profile']];function navhtml(bottom=false){return navs.map(([r,title,ic])=>`<button data-nav="${r}" class="${r===route?'active ':''}${r==='add'?'plus':''}">${icon(ic)}<span>${title}</span></button>`).join('')+(bottom?'':`<div class="hr"></div><button data-nav="library">${icon('strength')}Zásobník cviků</button><button data-nav="stats">${icon('stats')}Statistiky</button><button data-nav="tournaments" class="${route==='tournaments'?'active':''}">${icon('cup')}Turnaje</button><button data-nav="weight" class="${route==='weight'?'active':''}">${icon('stats')}Hmotnost</button><button data-nav="assistant" class="${route==='assistant'?'active':''}">${icon('chat')}Asistent</button>`)}
function btn(text,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${text}</button>`}function head(title,sub,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function badge(text,cls=''){return `<span class="badge ${cls}">${esc(text)}</span>`}function stat(label,value,unit,foot){return `<div class="card metric"><div class="eyebrow">${label}</div><div class="number">${value} <small>${unit}</small></div><div class="foot">${foot}</div></div>`}
function completed(from,to){return db.sessions.filter(x=>x.status==='done'&&x.type!=='Volno'&&x.date>=from&&x.date<=to)}function summary(from,to){let ts=completed(from,to),ss=db.sleep.filter(x=>x.date>=from&&x.date<=to);return {count:ts.length,load:ts.reduce((s,e)=>s+e.duration*e.rpe,0),minutes:ts.reduce((s,e)=>s+e.duration,0),rpe:avg(ts.map(x=>x.rpe)),bjj:ts.filter(x=>/BJJ|No-Gi/.test(x.type)).length,strength:ts.filter(x=>x.type==='Silový trénink').length,sleep:avg(ss.map(x=>x.hours)),nights:ss.length};}function recovery(date=today()){let c=db.checks.find(x=>x.date===date),s=db.sleep.find(x=>x.date===date);if(!c)return null;let subjective=avg([c.energy-1,c.motivation-1,c.rested-1,10-c.soreness,10-c.fatigue,10-c.stress])/9*100;let prev=summary(add(date,-1),add(date,-1)).load;return Math.round(subjective*(s?.6:.85)+(s?Math.min(s.hours/db.profile.sleepGoal,1)*25:0)+Math.max(0,100-prev/12)*.15)}
function prep(t){let d=diff(today(),t.date);return d>56?['Obecná příprava',0]:d>28?['Rozvoj síly a kondice',1]:d>14?['Specifická BJJ příprava',2]:d>7?['Ladění formy',3]:d>=0?['Turnajový týden',4]:['Po turnaji',4]}
function target(){let list=db.tournaments.filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));return targetMode==='Hlavní'?list.find(x=>x.main):list[0]}
function tournamentCard(){let t=target();return `<div class="card tournament"><div class="flex spread"><span class="eyebrow">${icon('cup',15)} &nbsp; PŘÍŠTÍ TURNAJ</span><div class="segmented">${['Nejbližší','Hlavní'].map(x=>`<button data-target="${x}" class="${targetMode===x?'active':''}">${x}</button>`).join('')}</div></div>${t?`<h2>${esc(t.name)}</h2><div class="muted" style="font-size:12px">${fmt(t.date,{day:'numeric',month:'long',year:'numeric'})} &nbsp; / &nbsp; ${esc(t.place)}</div><div class="countdown"><strong>${Math.floor(diff(today(),t.date)/7)}</strong><span>týdnů</span><i class="divider"></i><strong>${diff(today(),t.date)%7}</strong><span>dní do turnaje</span></div><div class="miniline"><span>${badge('Priorita '+t.priority,'orange')}</span><button class="textbutton" data-edit="tournaments:${esc(t.id)}">Detail turnaje ${icon('arrow',14)}</button></div><div class="phases">${Array.from({length:5},(_,i)=>`<i class="${i<=prep(t)[1]?'on':''}"></i>`).join('')}</div><div class="miniline"><span class="muted">Fáze přípravy</span><strong>${prep(t)[0]}</strong></div>${weightGoalCard(t)}`:`<h2>Tvůj další cíl?</h2><p class="muted">Přidej turnaj a odpočítávej do prvního zápasu.</p>${btn('Přidat turnaj','new-tournaments','primary')}`}</div>`}
function session(e){return `<button class="session" data-edit="sessions:${esc(e.id)}"><span class="time">${esc(e.start)}<small>${esc(e.end)}</small></span><span class="activityicon" style="--act:${tint(e.type)}">${icon(sporticon(e.type))}</span><span class="info"><strong>${esc(e.title)}</strong><small>${esc(activityLabel(e))} · ${e.duration} min · RPE ${e.rpe}</small>${isBjj(e.type)&&e.hasSparring?`<span class="strength-summary">+ sparring${e.rounds&&e.roundMinutes?' · '+e.rounds+' × '+e.roundMinutes+' min':''} · v rámci tréninku</span>`:''}${e.type==='Silový trénink'?`<span class="strength-summary">${groupSets(e.sets||[]).length} cviků · ${(e.sets||[]).length} sérií${e.favorite?' · ★ oblíbený':''}</span><span class="strength-summary">${esc(exerciseSummary(e.sets||[]))}</span>`:''}</span>${e.status==='done'?badge('Hotovo','green'):e.status==='skipped'?badge('Vynecháno'):''}<span class="arrow">${icon('arrow',15)}</span></button>`}
function bars(values,labels,{color='#ff7547',goal=0,unit='j.',height=150}={}){let max=Math.max(...values,goal,1)*1.15,w=560,h=height,pad=22,bw=Math.max(3,(w-50)/values.length*.48);return `<div class="chart"><svg viewBox="0 0 ${w} ${h+35}" role="img" aria-label="Interaktivní graf; klepni na sloupec pro hodnotu">${[0,.5,1].map(a=>`<line x1="25" x2="${w-5}" y1="${h-a*(h-pad)}" y2="${h-a*(h-pad)}" stroke="#303640" stroke-dasharray="3 5"/>`).join('')}${goal?`<line x1="25" x2="${w-5}" y1="${h-goal/max*(h-pad)}" y2="${h-goal/max*(h-pad)}" stroke="#8cbcff" stroke-dasharray="5 4"/>`:''}${values.map((v,i)=>{let x=30+i*(w-45)/values.length+(w-45)/values.length/2-bw/2,y=h-v/max*(h-pad);return `<g tabindex="0" role="button" data-chart="${esc(labels[i]+': '+num(v,1)+' '+unit)}" aria-label="${esc(labels[i]+', '+num(v,1)+' '+unit)}"><title>${esc(labels[i])}: ${num(v,1)} ${unit}</title><rect x="${x-7}" y="5" width="${bw+14}" height="${h}" fill="transparent"/><rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,h-y)}" rx="4" fill="${color}" opacity="${i===values.length-1?1:.65}"/>${values.length<=14||i%Math.ceil(values.length/8)===0?`<text text-anchor="middle" x="${x+bw/2}" y="${h+22}">${esc(labels[i])}</text>`:''}</g>`}).join('')}</svg></div>`}
function recoveryCard(){let c=db.checks.find(x=>x.date===today()),r=recovery();return `<div class="card"><div class="cardhead"><h2>Jak je na tom tvoje tělo?</h2>${badge('Dnes')}</div><div class="recoveryrow"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="51" fill="none" stroke="#30363b" stroke-width="8"/><circle cx="60" cy="60" r="51" fill="none" stroke="${r!==null&&r<45?'#f8818f':'#8bddb2'}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(r||0)/100*320.44} 320.44"/></svg><div class="inside"><strong>${recoveryLabel(r)}</strong><small>${r===null?'CHYBÍ DATA':r+' / 100 · ODHAD'}</small></div></div><div class="recoverydata">${[['Energie',c?.energy,'#8bddb2'],['Únava',c?.fatigue,'#e9b57f'],['Svalová bolest',c?.soreness,'#b8a3da']].map(([k,v,color])=>`<div><div class="miniline"><span class="muted">${k}</span><strong>${v??'—'} <span class="muted">/ 10</span></strong></div><div class="track"><i style="width:${(v||0)*10}%;background:${color}"></i></div></div>`).join('')}</div></div><div class="note">${r===null?'Začni krátkým ranním check-inem.':r<45?'Dnes zvaž lehčí trénink a více prostoru pro odpočinek.':'Drž se plánu a přizpůsob intenzitu tomu, jak se cítíš.'}</div><p class="formhint" style="margin-top:12px">Podklady: ${c?'dnešní check-in':'check-in chybí'} · ${db.sleep.some(x=>x.date===today())?'dnešní spánek':'spánek chybí'}. Nejde o lékařské hodnocení.</p>${c?.painLocation?`<p class="painnote">Omezení: ${esc(c.painLocation)} · ${c.painLevel||0}/10. ${esc(c.painNotes||'')}</p>`:''}<button class="textbutton" data-action="new-checks">${c?'Upravit ranní check-in':'Vyplnit ranní check-in'} ${icon('arrow',14)}</button></div>`}
function home(){let start=week(today()),s=summary(start,today()),prev=summary(add(start,-7),add(today(),-7)),plan=db.sessions.filter(x=>x.date===today()).sort((a,b)=>a.start.localeCompare(b.start)),last=db.sleep.filter(x=>x.date<=today()).sort((a,b)=>a.date.localeCompare(b.date)).at(-1),days=Array.from({length:7},(_,i)=>add(start,i));return head(`Ahoj, ${esc(db.profile.name||'sportovče')} <span style="color:var(--accent)">.</span>`,fmt(today(),{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+`<div class="grid two"><div class="card"><div class="cardhead"><h2>Dnes na programu</h2><button class="link" data-nav="calendar">Kalendář ${icon('arrow',14)}</button></div><div class="quickbuttons">${btn(icon('bjj',18)+' Zapsat BJJ','new-sessions','primary')}${btn(icon('strength',18)+' Zapsat sílu','new-strength')}</div><div class="miniline muted" style="margin-bottom:9px"><span>${plan.length} aktivity</span><span>${plan.reduce((a,e)=>a+e.duration,0)} plánovaných minut</span></div>${plan.length?plan.map(session).join(''):'<div class="empty">Dnes není nic zapsané. Volno můžeš zaznamenat výslovně v kalendáři.</div>'}</div>${recoveryCard()}</div><div class="grid metrics">${stat('Tréninky tento týden',s.count,'',`${s.bjj} BJJ / ${s.strength} silových`)}${stat('Odtrénovaný čas',num(s.minutes/60,1),'h',`${s.minutes} minut`)}${stat('Tréninková zátěž',num(s.load),'j.',prev.load?`${num((s.load/prev.load-1)*100)} % proti stejným dnům minulého týdne`:'Pro porovnání chybí data minulého týdne')}${stat('Spánek tento týden',s.nights?num(s.sleep,1):'—','h',`${s.nights} nocí · cíl ${db.profile.sleepGoal} h`)}</div><div class="grid two"><div class="${db.profile.compactTournament===false?'':'compactt'}">${tournamentCard()}<button class="textbutton" data-action="toggle-tournament">${db.profile.compactTournament===false?'Zmenšit kartu turnaje':'Rozbalit kartu turnaje'}</button></div><div class="card"><div class="cardhead"><h2>Spánek a odpočinek</h2>${icon('moon',19)}</div><div class="sleepbig"><strong>${last?num(last.hours,1):'—'} <span>hodin</span></strong><span>${last?fmt(last.date):'Zatím bez záznamu'}</span></div><p class="tag">${dayStatus(today())}</p><div class="streak">${Array.from({length:7},(_,i)=>{let v=db.sleep.find(x=>x.date===add(today(),i-6));return `<i class="${v?'on':''}" style="${v&&v.hours<db.profile.sleepGoal?'opacity:.5':''}" title="${v?`${v.date}: ${v.hours} h`:'Bez záznamu'}"></i>`}).join('')}</div><button class="textbutton" data-action="new-sleep">Zapsat poslední noc ${icon('arrow',14)}</button><p class="formhint">Den bez zápisu nepočítáme automaticky jako odpočinek.</p></div></div><details class="card" style="margin-top:20px"><summary>Zátěž týdne a vyhodnocení</summary><div style="padding-top:18px">${bars(days.map(d=>summary(d,d).load),days.map(d=>fmt(d,{weekday:'short'})))}<button class="textbutton" data-nav="report">Týdenní vyhodnocení ${icon('arrow',14)}</button></div></details>${healthDashboardCard()}${backupReminder()}<div class="demoalert">${db.demo?badge('UKÁZKOVÁ DATA'):'<i class="localdot"></i>'}<span>${db.demo?'Ukázkový deník · vše můžeš upravovat.':'Vlastní deník · data jen v tomto prohlížeči.'}</span></div>`}
function calendar(){let start=calMode==='Den'?calDate:calMode==='Týden'?week(calDate):calDate.slice(0,8)+'01',end=calMode==='Den'?start:calMode==='Týden'?add(start,6):iso(new Date(Number(start.slice(0,4)),Number(start.slice(5,7)),0));let days=Array.from({length:diff(start,end)+1},(_,i)=>add(start,i));const events=d=>[...db.sessions.filter(x=>x.date===d).map(x=>({...x,key:'sessions',label:x.title,color:tint(x.type)})),...db.tournaments.filter(x=>x.date===d).map(x=>({...x,key:'tournaments',label:x.name,color:'#ffd17b',start:'Turnaj'}))];return head('Tvůj tréninkový týden','Plánuj s rozmyslem. Trénuj s cílem.',btn(icon('plus',17)+' Přidat aktivitu','new-sessions','primary'))+`<div class="card"><div class="cardhead"><div class="flex">${btn('‹','cal-prev','small ghost')}<strong>${fmt(start,{day:'numeric',month:'short'})}${start!==end?' – '+fmt(end,{day:'numeric',month:'short',year:'numeric'}):''}</strong>${btn('›','cal-next','small ghost')}${btn('Dnes','cal-today','small ghost')}</div><div class="segmented">${['Den','Týden','Měsíc'].map(x=>`<button data-calmode="${x}" class="${calMode===x?'active':''}">${x}</button>`).join('')}</div></div>${calMode==='Týden'?weekList(days):calMode==='Měsíc'?`<div class="monthgrid">${['Po','Út','St','Čt','Pá','So','Ne'].map(x=>`<span class="tag" style="text-align:center">${x}</span>`).join('')}${Array.from({length:(new Date(start+'T12:00:00').getDay()+6)%7},()=>'<div></div>').join('')}${days.map(d=>`<button class="monthcell ${d===today()?'today':''}" data-day="${d}"><span>${Number(d.slice(-2))}</span>${events(d).slice(0,3).map(e=>`<small>${esc(e.label)}</small>`).join('')}</button>`).join('')}</div>`:`${db.sessions.filter(x=>x.date===calDate).map(session).join('')||'<div class="empty">V tento den nemáš trénink.</div>'}${db.tournaments.filter(x=>x.date===calDate).map(t=>`<button class="btn wide" data-edit="tournaments:${esc(t.id)}">${icon('cup')} ${esc(t.name)}</button>`).join('')}${btn('Přidat trénink v tomto dni','new-selected','primary')}`}</div><div class="flex" style="margin-top:17px">${btn('Zobrazit turnaje','nav-tournaments')}${btn('Zkopírovat týden dopředu','copy-week')}${btn('Historie tréninků','nav-history')}</div><div class="legend" style="margin-top:22px;flex-wrap:wrap">${[['BJJ','#ff7547'],['Síla','#8cbcff'],['Kondice','#8bddb2'],['Turnaj','#ffd17b']].map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`}
function addPage(){return head('Každý zápis se počítá.','Co chceš dnes zaznamenat?')+`<div class="addtiles">${[['sessions','bjj','BJJ trénink','Technika, pozice, sparring a RPE.'],['strength','strength','Silový trénink','Cviky, série, opakování a váhy.'],['sleep','moon','Spánek','Poslední noc a tvoje regenerace.'],['checks','heart','Ranní check-in','Šest otázek. Půl minuty pro sebe.'],['tournaments','cup','Turnaj','Nový cíl, registrace a odpočet.'],['conditioning','bolt','Kondice a mobilita','Vše, co podporuje tvůj výkon.'],['recovery','moon','Regenerace','Odpočinkové a regenerační aktivity.'],['other','plus','Ostatní','Pojmenuj si vlastní aktivitu.'],['weights','stats','Hmotnost','Datum, čas, kilogramy a vývoj.']].map(([key,ic,title,desc])=>`<button class="tile" data-action="new-${key}"><div class="activityicon" style="--act:${key==='strength'?'#8cbcff':key==='sleep'?'#b9a0ef':'#ff996b'}">${icon(ic,23)}</div><h3>${title}</h3><p>${desc}</p><span class="tag">Přidat záznam ${icon('arrow',13)}</span></button>`).join('')}</div>${favoriteStarts()}`}
function statsPage(){let from=add(today(),1-period),s=summary(from,today()),days=Array.from({length:period},(_,i)=>add(from,i));let values=days.map(d=>{let ts=completed(d,d),c=db.checks.find(x=>x.date===d),sl=db.sleep.find(x=>x.date===d);return metric==='Zátěž'?summary(d,d).load:metric==='Spánek'?sl?.hours||0:metric==='Regenerace'?recovery(d)||0:metric==='Energie'?c?.energy||0:metric==='Únava'?c?.fatigue||0:ts.length});return head('Výkon v souvislostech','Záznamy, které se mění v užitečný přehled.')+`<div class="flex spread"><div class="segmented">${[7,30,90].map(n=>`<button data-period="${n}" class="${period===n?'active':''}">${n} dní</button>`).join('')}</div><span class="tag">${fmt(from)} – ${fmt(today())}</span></div><div class="grid metrics">${stat('Tréninky',s.count,'',`${s.bjj} BJJ / ${s.strength} síla`)}${stat('Celková zátěž',num(s.load),'j.','Minuty × subjektivní RPE')}${stat('Čas tréninku',num(s.minutes/60,1),'h',`${s.minutes} minut`)}${stat('Průměrný spánek',s.nights?num(s.sleep,1):'—','h',`${s.nights} zaznamenaných nocí`)}</div><div class="card"><div class="cardhead"><h2>Jak se vyvíjíš</h2></div><div class="segmented" style="margin-bottom:16px">${['Zátěž','Tréninky','Spánek','Regenerace','Energie','Únava'].map(m=>`<button data-metric="${m}" class="${metric===m?'active':''}">${m}</button>`).join('')}</div>${bars(values,days.map(d=>fmt(d,{day:'numeric',month:'numeric'})),{color:metric==='Spánek'?'#8cbcff':metric==='Regenerace'?'#8bddb2':'#ff7547',unit:metric==='Spánek'?'h':metric==='Zátěž'?'j.':metric==='Tréninky'?'tréninků':'bodů',goal:metric==='Spánek'?db.profile.sleepGoal:0,height:190})}<p class="tag" style="margin-top:10px">Klepni na sloupec. Dny bez záznamu jsou zobrazené u nuly, neznamenají naměřenou hodnotu.</p></div><div class="grid half" style="margin-top:20px"><div class="card"><h2>Silový deník</h2>${completed(from,today()).filter(e=>e.type==='Silový trénink').slice(-5).reverse().map(e=>`<button class="session" data-edit="sessions:${esc(e.id)}"><span class="info"><strong>${esc(e.title)}</strong><small>${fmt(e.date)} · ${(e.sets||[]).length} sérií</small></span><strong>${esc(strengthAmounts(e.sets||[]))}</strong></button>`).join('')||'<p class="muted">Zapiš první silový trénink.</p>'}</div><div class="card"><h2>Co říkají tvoje data</h2>${advice().map(t=>`<p style="font-size:13px">${esc(t)}</p>`).join('')}${btn('Otevřít asistenta','nav-assistant','small')}</div></div>`}
function advice(){let start=week(today()),s=summary(start,today()),prev=summary(add(start,-7),add(today(),-7)),a=[];if(s.count)a.push(`Tento týden máš ${s.count} absolvovaných tréninků, ${s.minutes} minut a zátěž ${num(s.load)} jednotek.`);else a.push('Tento týden zatím chybí absolvované tréninky. Naplánované aktivity se do zátěže nepočítají.');if(s.nights)a.push(`Spánek: průměr ${num(s.sleep,1)} h z ${s.nights} nocí. Cíl je ${db.profile.sleepGoal} h.${s.sleep<db.profile.sleepGoal?' Zkus vytvořit více prostoru pro spánek.':''}`);else a.push('Pro vyhodnocení spánku zatím chybí záznamy.');let r=recovery();if(r!==null&&r<50)a.push(`Dnešní orientační regenerace je ${r}/100. Zvaž lehčí aktivitu a podle pocitu prober zátěž s trenérem.`);if(prev.load)a.push(`Zátěž proti stejným dnům minulého týdne se změnila o ${num((s.load/prev.load-1)*100)} %. Porovnávám stejně dlouhá období.`);return a}
function tournamentPage(){return head('Další výzva čeká.','Od přípravy až po poslední zápas.',btn(icon('plus',16)+' Přidat turnaj','new-tournaments','primary'))+`<div class="grid half">${db.tournaments.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<div class="card tournament"><div class="flex spread">${badge('Priorita '+t.priority,'orange')}${t.main?badge('Hlavní turnaj','green'):''}</div><h2>${esc(t.name)}</h2><p class="muted">${fmt(t.date,{day:'numeric',month:'long',year:'numeric'})}<br>${esc(t.place)}</p><h3>${diff(today(),t.date)>=0?`${diff(today(),t.date)} dní do turnaje`:'Proběhlý turnaj'}</h3><p class="tag">${prep(t)[0]}</p>${weightGoalCard(t)}<button class="btn" data-edit="tournaments:${esc(t.id)}">Upravit turnaj ${icon('arrow',15)}</button></div>`).join('')||'<div class="card empty">Zatím žádný turnaj. Přidej si svůj příští cíl.</div>'}</div>`}
function history(){return head('Tréninkový deník','Vyhledávej podle názvu, techniky nebo data.')+`<div class="card"><label>Hledat<input id="search" type="search" placeholder="Např. guard, dřep, 2026-10…"></label><div id="historylist">${historyRows('')}</div></div>`}function historyRows(q){let list=db.sessions.filter(e=>JSON.stringify(e).toLocaleLowerCase('cs').includes(q.toLocaleLowerCase('cs'))).sort((a,b)=>b.date.localeCompare(a.date));return list.map(e=>`<div class="tag" style="padding-top:14px">${fmt(e.date,{weekday:'short',day:'numeric',month:'long'})}</div>${session(e)}`).join('')||'<div class="empty">Žádné odpovídající záznamy.</div>'}
function profilePage(){return head('Tvůj profil. Tvoje data.','Bez účtu a bez předplatného.')+`<div class="grid half"><div class="card"><h2>Osobní cíle</h2><form id="profileform" class="forms"><label>Jméno nebo přezdívka<input name="name" maxlength="60" value="${esc(db.profile.name)}"></label><label>BJJ pásek<select name="belt">${['Bílý','Modrý','Fialový','Hnědý','Černý','Neuveden'].map(x=>`<option ${x===db.profile.belt?'selected':''}>${x}</option>`).join('')}</select></label><label>Hlavní cíl<textarea name="goal" maxlength="1000">${esc(db.profile.goal)}</textarea></label><label>Spánkový cíl (hodiny)<input name="sleepGoal" type="number" min="1" max="24" step="0.25" value="${db.profile.sleepGoal}" required></label><button class="btn primary" type="submit">Uložit profil</button></form></div><div class="grid"><div class="card"><h2>Hmotnost</h2><p class="muted" style="font-size:13px">Vážení, vývoj hmotnosti a váhové cíle turnajů.</p>${btn('Otevřít monitoring','nav-weight')}<div class="hr"></div><h2>Export a zálohování</h2><p class="muted" style="font-size:13px">Data zůstávají v úložišti této aplikace na tvém zařízení. Pravidelně si ulož vlastní JSON zálohu. Při přechodu z předchozího HTML souboru použij jeho Export JSON a zde Obnovit zálohu.</p><div class="flex">${btn(icon('download',16)+' Export JSON','export')}${btn('Obnovit zálohu','import')}${btn('Export CSV','csv')}</div></div><div class="card"><h2>Prostor na zkoušení</h2><p class="muted" style="font-size:13px">${db.demo?'Pracuješ s ukázkovými daty. Můžeš je upravovat a mazat.':'Teď používáš vlastní deník.'} Reset přepíše aktuální záznamy.</p><div class="flex">${btn('Obnovit ukázková data','reset')}${btn('Začít s prázdným deníkem','clear','danger')}</div></div><div class="card"><h2>Co je tato beta?</h2><p class="muted" style="font-size:13px">Android beta založená na původním vzhledu v7. Deník se ukládá místně v aplikaci. Neodesílá údaje na server a nepotřebuje internet.</p><p class="tag">Systémové notifikace a synchronizace zatím nejsou součástí. Při odinstalaci nebo vymazání dat aplikace deník zmizí. Uchovávej JSON zálohu mimo aplikaci.</p></div></div></div>`}
function assistantPage(){return head('Tréninkový asistent','Žádné API. Odpovědi jen z tvých záznamů.')+`<div class="grid two"><div class="card"><h2>Na co se chceš podívat?</h2><form id="askform" class="forms"><label>Tvá otázka<input name="question" placeholder="Spím dostatečně?" required maxlength="500"></label><button class="btn primary">Vyhodnotit moje data ${icon('arrow',17)}</button></form><div class="hr"></div><div class="forms">${['Jak jsem trénoval tento týden?','Spím dostatečně?','Jaká je moje regenerace?','Kolik dní zbývá do turnaje?','Jaké techniky jsem procvičoval?'].map(q=>`<button class="btn ghost" data-question="${esc(q)}" style="justify-content:space-between;text-align:left">${q}${icon('arrow',15)}</button>`).join('')}</div></div><div class="card"><div class="cardhead"><h2>Tvůj přehled</h2>${badge('OFFLINE','green')}</div><div id="answer" class="chatanswer">${advice().map(esc).join('\n\n')}</div><div class="note orange">Orientační doporučení nejsou lékařská diagnóza. Asistent nepředepisuje shazování hmotnosti ani extrémní zátěž.</div></div></div>`}
function answer(q){let t=target(),r=recovery();if(/turnaj|zbývá/i.test(q))return t?`${t.name}\n${fmt(t.date,{day:'numeric',month:'long',year:'numeric'})}\n\nZbývá ${diff(today(),t.date)} dní, tedy ${Math.floor(diff(today(),t.date)/7)} týdnů a ${diff(today(),t.date)%7} dní.\nAktuální fáze: ${prep(t)[0]}.`:'Zatím nemáš budoucí turnaj. Přidej ho v sekci Turnaje.';if(/regenerac/i.test(q))return r===null?'Vyplň dnešní ranní check-in. Bez něj skóre nevypočítávám.':`Dnešní orientační skóre: ${r}/100.\n\nModel: 60 % subjektivní stav, 25 % dosažení spánkového cíle, 15 % zátěž předchozího dne. Bez spánku má subjektivní část 85 %.\nNejde o lékařské hodnocení.`;if(/technik|pozic/i.test(q))return db.sessions.filter(e=>e.status==='done'&&/BJJ|No-Gi/.test(e.type)&&e.techniques).slice(-5).map(e=>fmt(e.date)+': '+e.techniques).join('\n\n')||'Zatím nejsou zapsané techniky.';if(/spím|spán/i.test(q)){let s=summary(add(today(),-6),today());return s.nights?`Za posledních 7 dní máš ${s.nights} zapsaných nocí. Průměr je ${num(s.sleep,1)} hodiny, tvůj cíl ${db.profile.sleepGoal} hodin.\n\n${s.sleep<db.profile.sleepGoal?'Zkus vytvořit více prostoru pro spánek.':'Průměr dosahuje cíle. Vnímej také kvalitu spánku a odpočinutí.'}`:'Chybí záznamy spánku.'}return advice().join('\n\n')}

let editing=null,returnFocus=null;function field(label,name,value,type='text',extra=''){return `<label>${label}<input type="${type}" name="${name}" value="${esc(value)}" ${extra}></label>`}function select(label,name,value,options){return `<label>${label}<select name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`}
function openEditor(key,id,date=today(),subtype='',draft=null){if(editing&&hasUnsavedChanges()&&!confirm('Máš neuložené změny. Zahodit je a otevřít jiný záznam?'))return;let source=draft?null:db[key].find(x=>x.id===id);if(!source&&['sleep','checks'].includes(key))source=db[key].find(x=>x.date===date);let e=draft?clone(draft):source?clone(source):{id:uid(),date};if(!source&&!draft){if(key==='sessions')Object.assign(e,{title:subtype==='strength'?'Síla celého těla':subtype==='conditioning'?'Kondiční trénink':subtype==='recovery'?'Regenerace':subtype==='other'?'Vlastní aktivita':'BJJ No-Gi',type:subtype==='strength'?'Silový trénink':subtype==='conditioning'?'Kondiční trénink':subtype==='recovery'?'Regenerace':subtype==='other'?'Ostatní':types[0],start:'18:00',end:'19:00',duration:60,rpe:6,status:subtype==='plan'?'planned':'done',techniques:'',notes:'',sets:subtype==='strength'?makeExercise('Dřep',3):[]});if(key==='sleep')Object.assign(e,{start:'23:00',end:'07:00',hours:8,quality:7,notes:''});if(key==='checks')Object.assign(e,{energy:7,soreness:3,fatigue:4,stress:3,motivation:7,rested:7});if(key==='weights')Object.assign(e,{time:currentTime(),kg:latestWeight()?.kg??'',notes:''});if(key==='tournaments')Object.assign(e,{name:'',date:add(today(),56),place:'',priority:'B',main:false,notes:''});}

function setsHtml(sets){return groupSets(sets).map((g,gi)=>{let first=g.sets[0],unit=setUnit(first),cfg=setUnits[unit],different=g.sets.some(x=>x.reps!==first.reps||x.weight!==first.weight||(x.effort??7)!==(first.effort??7)||(x.mode||'RPE')!==(first.mode||'RPE'));return `<section class="exerciseblock" data-group="${esc(g.id)}"><div class="exhead"><strong>CVIK ${gi+1}${different?' · RŮZNÉ SÉRIE':''}</strong><button type="button" class="textbutton" data-delete-exercise="${esc(g.id)}" style="color:var(--muted)" aria-label="Odstranit cvik ${esc(g.name)}">Odstranit</button></div><div class="exercise-unit"><label>Zapisovat jako<select name="setUnit" aria-label="Jednotka cviku">${Object.entries(setUnits).map(([value,c])=>`<option value="${value}" ${unit===value?'selected':''}>${c.label}</option>`).join('')}</select></label><span class="tag">${g.sets.length} × ${setQuantity(first)}${different?' · různé série':''}</span></div><div class="compact-exercise"><label>Cvik<input name="setExercise" list="exerciseoptions" value="${esc(g.name)}" placeholder="Dřep" maxlength="100" required></label><label>Série × ${cfg.short}<span class="multiplier"><input name="setQuickCount" type="number" value="${g.sets.length}" min="1" max="30" step="1" required aria-label="Počet sérií"><span>×</span><input name="setQuickReps" type="number" value="${first.reps}" min="0" max="${cfg.max}" step="${cfg.step}" required aria-label="${cfg.label} ve všech sériích"></span></label><label>Intenzita<span class="effortpair"><select name="setQuickMode" aria-label="Měřítko intenzity"><option ${(first.mode||'RPE')==='RPE'?'selected':''}>RPE</option><option ${first.mode==='RIR'?'selected':''}>RIR</option></select><input name="setQuickEffort" type="number" value="${first.effort??7}" min="${first.mode==='RIR'?0:1}" max="10" step="0.5" required aria-label="Intenzita všech sérií"></span></label><label>Váha kg<input name="setQuickWeight" type="number" value="${first.weight}" min="0" max="2000" step="0.25" required aria- function collectSets(){let blocks=[...$('#entryform').querySelectorAll('.exerciseblock')];return blocks.flatMap(b=>{let name=b.querySelector('[name=setExercise]').value.trim(),exerciseNotes=b.querySelector('[name=setExerciseNotes]').value;return [...b.querySelectorAll('[data-series]')].map(r=>({groupId:b.dataset.group,exercise:name,exerciseNotes,unit:b.querySelector('[name=setUnit]').value,reps:Number(r.querySelector('[name=setReps]').value),weight:Number(r.querySelector('[name=setWeight]').value),mode:r.querySelector('[name=setMode]').value,effort:Number(r.querySelector('[name=setEffort]').value),notes:r.querySelector('[name=setNote]').value}));});}

function formFingerprint(){const form=$('#entryform');return form?JSON.stringify([...new FormData(form)].filter(([key])=>key!=='copyMonth')):'';}
function hasUnsavedChanges(){return !!editing&&editing.initialFingerprint!==undefined&&editing.initialFingerprint!==formFingerprint();}
function closeEditor(force=false){if(!force&&hasUnsavedChanges()&&!confirm('Zahodit neuložené změny?'))return false;copyPicker=null;document.body.style.overflow='';$('#overlay').innerHTML='';editing=null;returnFocus?.focus();return true;}
function saveEntry(form){let key=editing.key,e=clone(editing.e),v=new FormData(form),copy=clone(db);for(const [k,value] of v)if(!k.startsWith('set')&&k!=='copyMonth'&&k!=='trainingBlock'&&k!=='trainingCombo')e[k]=value;for(const k of key==='sessions'?['duration','rpe']:key==='sleep'?['hours','quality']:key==='checks'?['energy','soreness','fatigue','stress','motivation','rested']:[])e[k]=Number(e[k]);if(key==='sessions'){e.sets=e.type==='Silový trénink'?collectSets():[];e.favorite=v.has('favorite');applyActivityDetails(e,v);if(e.type!=='Volno'&&e.duration<=0)throw Error('Trénink musí mít délku větší než nula.');if(e.type==='Silový trénink'&&!e.sets.length)throw Error('Přidej alespoň jeden cvik a sérii.');}if(key==='checks')e.painLevel=Number(v.get('painLevel')||0);if(key==='weights'){if(e.date>today())throw Error('Skutečný záznam nemůže mít budoucí datum.');if(key==='weights'&&weightTimestamp(e)>today()+'T'+currentTime())throw Error('Čas skutečného vážení nemůže být v budoucnosti.');for(const k of ['kg']){if(String(v.get(k)??'').trim()==='')throw Error('Doplň všechny hodnoty; nevyplněné pole není nula.');e[k]=Number(v.get(k));}e.updatedAt=new Date().toISOString();}if(key==='tournaments'){let target=v.get('targetWeight');if(target!==null){if(String(target).trim()==='')delete e.targetWeight;else e.targetWeight=Number(target);}e.main=v.has('main');if(e.main)copy.tournaments.forEach(x=>x.main=false)}if(!validDate(e.date))throw Error('Zadej platné datum.');if(['sleep','checks'].includes(key))copy[key]=copy[key].filter(x=>x.date!==e.date||x.id===e.id);let i=copy[key].findIndex(x=>x.id===e.id);if(i>=0)copy[key][i]=e;else copy[key].push(e);validate(copy);db=copy;save();closeEditor(true);render();toast(storage?'Záznam uložen v prohlížeči.':'Záznam uložen jen pro toto otevření stránky.');}

const MAX_BACKUP_BYTES=10*1024*1024;
function parseBackupText(text){if(typeof text!=='string'||!text.replace(/^\uFEFF/,'').trim())throw Error('Soubor je prázdný nebo se jeho obsah nepodařilo přečíst. Vyber jinou zálohu nebo ji z původní aplikace exportuj znovu.');if(new Blob([text]).size>MAX_BACKUP_BYTES)throw Error('Záloha je větší než 10 MB.');let parsed;try{parsed=JSON.parse(text.replace(/^\uFEFF/,''));}catch(e){throw Error('Soubor neobsahuje úplný platný JSON. Může být poškozený nebo neúplně uložený. Původní deník nebyl změněn.');}return validate(parsed);}
function restoreBackupText(text){let parsed=parseBackupText(text);if(!confirm(`Záloha obsahuje ${parsed.sessions.length} tréninků, ${parsed.sleep.length} záznamů spánku a ${parsed.weights.length} vážení. Nahradit současný deník touto zálohou?`))return false;let serialized=JSON.stringify(parsed);try{localStorage.setItem(KEY,serialized);}catch(e){throw Error('Zálohu nelze trvale uložit do zařízení. Původní deník nebyl nahrazen.');}db=parsed;savedRaw=serialized;storage=true;storageLocked=false;$('#storagewarn').hidden=true;render();toast('Záloha obnovena a uložena v zařízení.');return true;}

function makeExercise(name='Dřep',count=3){let groupId=uid();return Array.from({length:count},()=>({groupId,exercise:name,unit:'reps',reps:5,weight:0,effort:7,mode:'RPE',notes:'',exerciseNotes:''}));}

function changeExerciseUnit(el){let block=el.closest('.exerciseblock'),cfg=setUnits[el.value];if(!block||!cfg)return;let quick=block.querySelector('[name=setQuickReps]');quick.closest('label').firstChild.textContent='Série × '+cfg.short;quick.max=cfg.max;quick.step=cfg.step;quick.setAttribute('aria-label',cfg.label+' ve všech sériích');for(const row of block.querySelectorAll('[data-series]')){let input=row.querySelector('[name=setReps]');input.closest('label').firstChild.textContent=cfg.label;input.max=cfg.max;input.step=cfg.step;}refreshCompactSummary(block);updateStrengthTotal();}
document.addEventListener('change',ev=>{if(ev.target.name==='setUnit')changeExerciseUnit(ev.target);});

function syncQuickExercise(el){let block=el.closest('.exerciseblock');if(!block)return;let key=el.name;if(key==='setQuickCount'){let count=Number(el.value);if(!Number.isInteger(count)||count<1||count>30){toast('Počet sérií musí být 1–30.');return;}let groups=groupSets(collectSets()),g=groups.find(x=>x.id===block.dataset.group);if(count<g.sets.length&&!confirm('Zmenšit počet sérií? Poslední série se odstraní.')){el.value=g.sets.length;return;}while(g.sets.length<count)g.sets.push(clone(g.sets.at(-1)));g.sets=g.sets.slice(0,count);redrawSets(groups.flatMap(x=>x.sets));return;}let mapping={setQuickReps:'setReps',setQuickWeight:'setWeight',setQuickMode:'setMode',setQuickEffort:'setEffort'};if(!mapping[key])return;for(const row of block.querySelectorAll('[data-series]')){row.querySelector(`[name=${mapping[key]}]`).value=el.value;if(key==='setQuickMode'){let input=row.querySelector('[name=setEffort]');input.min=el.value==='RIR'?'0':'1';if(Number(input.value)<Number(input.min))input.value=input.min;}}if(key==='setQuickMode'){let quick=block.querySelector('[name=setQuickEffort]');quick.min=el.value==='RIR'?'0':'1';if(Number(quick.value)<Number(quick.min))quick.value=quick.min;}refreshCompactSummary(block);updateStrengthTotal();}

function refreshCompactSummary(block){let rows=[...block.querySelectorAll('[data-series]')];if(!rows.length)return;let values=rows.map(r=>({reps:r.querySelector('[name=setReps]').value,weight:r.querySelector('[name=setWeight]').value,mode:r.querySelector('[name=setMode]').value,effort:r.querySelector('[name=setEffort]').value})),first=values[0];for(const [quick,key] of [['setQuickReps','reps'],['setQuickWeight','weight'],['setQuickMode','mode'],['setQuickEffort','effort']])block.querySelector(`[name=${quick}]`).value=first[key];block.querySelector('[name=setQuickCount]').value=rows.length;block.querySelector('[name=setQuickEffort]').min=first.mode==='RIR'?'0':'1';let varied=values.some(x=>Object.keys(first).some(k=>x[k]!==first[k]));block.querySelector('.variedhint').hidden=!varied;let unit=block.querySelector('[name=setUnit]').value;block.querySelector('.exercise-unit .tag').textContent=rows.length+' × '+num(Number(first.reps),2)+' '+setUnits[unit].short+(varied?' · různé série':'');}
document.addEventListener('change',ev=>{let el=ev.target;if(el.name?.startsWith('setQuick'))syncQuickExercise(el);else if(['setReps','setWeight','setMode','setEffort'].includes(el.name)){let block=el.closest('.exerciseblock');if(block)refreshCompactSummary(block);}if(el.hasAttribute('data-copy-date')&&copyPicker){let date=el.dataset.copyDate;if(el.checked)copyPicker.selected.add(date);else copyPicker.selected.delete(date);renderCopyPicker();}if(el.name==='copyMonth'&&copyPicker&&/^\d{4}-\d{2}$/.test(el.value)){copyPicker.month=el.value+'-01';renderCopyPicker();}});
function readTrainingDraft(){let form=$('#entryform');if(!form||editing?.key!=='sessions')throw Error('Nejdřív otevři trénink.');if(!form.reportValidity())throw Error('Zkontroluj povinná pole tréninku.');let v=new FormData(form),e=clone(editing.e);for(const [k,x] of v)if(!k.startsWith('set')&&k!=='copyMonth'&&k!=='trainingBlock'&&k!=='trainingCombo')e[k]=x;for(const k of ['duration','rpe'])e[k]=Number(e[k]);e.favorite=v.has('favorite');e.sets=e.type==='Silový trénink'?collectSets():[];applyActivityDetails(e,v);if(e.type!=='Volno'&&e.duration<=0)throw Error('Délka tréninku musí být větší než nula.');if(e.type==='Silový trénink'&&!e.sets.length)throw Error('Přidej alespoň jeden cvik.');let draftDb=clone(db);draftDb.sessions=draftDb.sessions.filter(x=>x.id!==e.id).concat(e);validate(draftDb);return e;}
function openCopyPicker(){try{let draft=readTrainingDraft();copyPicker={month:draft.date.slice(0,8)+'01',sourceDate:draft.date,selected:new Set(),draft};renderCopyPicker();$('#copy-slot').scrollIntoView?.({behavior:'smooth',block:'start'});}catch(e){$('#formerror').textContent=e.message;}}
function renderCopyPicker(){if(!copyPicker)return;let {month,selected,sourceDate}=copyPicker,start=month,year=Number(month.slice(0,4)),m=Number(month.slice(5,7)),end=iso(new Date(year,m,0)),offset=(new Date(start+'T12:00:00').getDay()+6)%7,days=Array.from({length:diff(start,end)+1},(_,i)=>add(start,i));$('#copy-slot').innerHTML=`<section class="copy-panel" aria-label="Vybrat dny pro kopírování"><div class="flex spread"><h3 style="margin:0">Kopírovat do vybraných dnů</h3><button type="button" class="textbutton" data-action="copy-cancel">Zavřít</button></div><p class="copyhint">Zaškrtni cílové dny. Můžeš přecházet mezi měsíci — výběr zůstane zachovaný. Den původního tréninku je vypnutý.</p><div class="copy-month"><button type="button" class="btn small" data-copy-shift="-1" aria-label="Předchozí měsíc">‹</button><strong>${fmt(month,{month:'long',year:'numeric'})}</strong><button type="button" class="btn small" data-copy-shift="1" aria-label="Následující měsíc">›</button></div><label>Přejít na měsíc<input type="month" name="copyMonth" value="${month.slice(0,7)}"></label><div class="copy-grid">${['Po','Út','St','Čt','Pá','So','Ne'].map(x=>`<span class="weekdaylabel">${x}</span>`).join('')}${Array.from({length:offset},()=>'<span></span>').join('')}${days.map(d=>`<label class="copy-day" title="${fmt(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}${d===sourceDate?' · původní trénink':''}"><input type="checkbox" data-copy-date="${d}" ${selected.has(d)?'checked':''} ${d===sourceDate?'disabled':''} aria-label="Kopírovat na ${d}"><span>${Number(d.slice(-2))}</span><span class="tick">✓</span></label>`).join('')}</div><div class="copy-actions"><button type="button" class="btn small ghost" data-copy-tomorrow>Přidat zítřek</button><button type="button" class="btn small ghost" data-copy-clear>Zrušit výběr</button></div><div class="copy-selection">${[...selected].sort().map(d=>`<button type="button" data-copy-remove="${d}" aria-label="Odebrat datum ${d}">${fmt(d,{day:'numeric',month:'short',year:'numeric'})} ×</button>`).join('')}</div><p class="formhint"><strong>${selected.size} vybraných dní.</strong> Přenesou se časy, cviky, série, intenzita a poznámky jako <strong>naplánované</strong> tréninky. Originál se nepřesune ani nepřepíše. Kopie použijí aktuálně vyplněný formulář; změny originálu uložíš zvlášť.</p><p id="copyerror" class="copy-error" role="alert"></p><div class="copy-footer"><button type="button" class="btn primary" data-action="copy-confirm" ${selected.size?'':'disabled'}>Vytvořit ${selected.size} ${selected.size===1?'kopii':'kopií'}</button></div></section>`;}
function copyAction(el){if(!copyPicker)return false;if(el.hasAttribute('data-copy-shift')){let d=new Date(copyPicker.month+'T12:00:00');d.setMonth(d.getMonth()+Number(el.dataset.copyShift));copyPicker.month=iso(d);renderCopyPicker();return true;}if(el.hasAttribute('data-copy-remove')){copyPicker.selected.delete(el.dataset.copyRemove);renderCopyPicker();return true;}if(el.hasAttribute('data-copy-clear')){copyPicker.selected.clear();renderCopyPicker();return true;}if(el.hasAttribute('data-copy-tomorrow')){let date=add(today(),1);if(date!==copyPicker.sourceDate)copyPicker.selected.add(date);copyPicker.month=date.slice(0,8)+'01';renderCopyPicker();return true;}return false;}
function makeCopies(draft,dates){let selected=[...new Set(dates)].sort();if(!selected.length)throw Error('Vyber alespoň jeden cílový den.');if(selected.length>366)throw Error('Najednou lze vytvořit nejvýše 366 kopií.');if(selected.some(d=>!validDate(d)||d===draft.date))throw Error('Cílové dny musí být platné a jiné než den originálu.');return selected.map(date=>({...clone(draft),id:uid(),date,status:'planned',favorite:false,sets:(draft.sets||[]).map(x=>({...clone(x),done:false})),copiedFrom:draft.id}));}
function commitCopies(){if(!copyPicker)return;try{let draft=readTrainingDraft();if(draft.date!==copyPicker.sourceDate)throw Error('Datum originálu se změnilo. Zavři výběr a otevři kopírování znovu.');let copies=makeCopies(draft,[...copyPicker.selected]);let clashes=copies.filter(e=>db.sessions.some(x=>x.date===e.date&&x.start===e.start&&x.type!=='Volno')).map(e=>e.date);if(clashes.length&&!confirm(`Ve stejném čase už máš trénink v ${clashes.length} vybraných dnech (${clashes.map(d=>fmt(d)).join(', ')}). Přesto přidat nové kopie?`))return;let next=clone(db);next.sessions.push(...copies);validate(next);db=next;save();copyPicker=null;$('#copy-slot').innerHTML='';render();toast(`${copies.length} ${copies.length===1?'kopie naplánována':'kopií naplánováno'}. Originál zůstává otevřený.`);}catch(e){$('#copyerror').textContent=e.message;}}

document.addEventListener('change',ev=>{let el=ev.target;if(el.name==='hasSparring')syncSparringFields();if(el.name==='type'&&el.value==='Ostatní'){$('#otheractivity input')?.focus();}});
document.addEventListener('input',ev=>{let el=ev.target;if(['rounds','roundMinutes','duration'].includes(el.name))syncSparringFields();if(el.name==='customActivity'){let f=$('#entryform');if(f?.elements?.title&&el.value.trim())f.elements.title.value=el.value.trim();}});

function currentTime(){let d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function weightTimestamp(e){return e.date+'T'+e.time;}
function weightHistory(from='0000-01-01',to=today()){let now=today()+'T'+currentTime();return (db.weights||[]).filter(e=>e.date>=from&&e.date<=to&&weightTimestamp(e)<=now).sort((a,b)=>weightTimestamp(a).localeCompare(weightTimestamp(b))||a.id.localeCompare(b.id));}
function latestWeight(){return weightHistory().at(-1)||null;}
function dailyWeightAverage(from,to){let byDay=new Map();for(const e of weightHistory(from,to)){if(!byDay.has(e.date))byDay.set(e.date,[]);byDay.get(e.date).push(e.kg);}return {average:byDay.size?avg([...byDay.values()].map(avg)):null,days:byDay.size};}
function goalStatus(t){if(!finite(t.targetWeight,1,500))return {kind:'missing',text:'Váhový cíl není nastaven.'};let last=latestWeight();if(!last)return {kind:'no-data',text:'Pro výpočet rozdílu nejdřív zapiš hmotnost.'};let delta=Math.round((t.targetWeight-last.kg)*100)/100;if((t.weightGoalMode||'target')==='limit')return {kind:delta>=0?'within':'lose',text:delta>=0?`V limitu · rezerva ${num(delta,2)} kg`:`Do limitu zbývá snížit hmotnost o ${num(-delta,2)} kg`,last,delta};return {kind:Math.abs(delta)<.01?'met':delta<0?'lose':'gain',text:Math.abs(delta)<.01?'Cílová hmotnost dosažena.':delta<0?`Do cíle zbývá zhubnout ${num(-delta,2)} kg`:`Do cíle zbývá přibrat ${num(delta,2)} kg`,last,delta};}
function weightGoalCard(t){if(!finite(t.targetWeight,1,500))return '';let g=goalStatus(t),days=validDate(t.date)?diff(today(),t.date):null;return `<div class="goalpanel"><span class="eyebrow">${t.weightGoalMode==='limit'?'LIMIT KATEGORIE':'VÁHOVÝ CÍL'} ${num(t.targetWeight,2)} KG</span>${t.weightCategory?`<p>Kategorie: ${esc(t.weightCategory)}</p>`:''}<strong>${esc(g.text)}</strong><p>${g.last?`Poslední vážení ${num(g.last.kg,2)} kg · ${fmt(g.last.date)} ${esc(g.last.time)}`:'Zatím bez aktuálního vážení.'}${days===null?'':days>=0?` · ${days} dní do turnaje`:' · Turnaj už proběhl'}</p>${g.last&&diff(g.last.date,today())>7?'<p>Poslední vážení je starší než týden. Rozdíl vychází z tohoto staršího údaje.</p>':''}<button type="button" class="textbutton" data-action="new-weights">Zapsat nové vážení ${icon('arrow',13)}</button></div>`;}

function healthDashboardCard(){let w=latestWeight();return `<div class="card" style="margin-top:20px"><div class="cardhead"><h2>Hmotnost</h2><button class="link" data-nav="weight">Monitoring ${icon('arrow',14)}</button></div><div class="flex spread"><div><strong style="font-size:25px">${w?num(w.kg,2)+' kg':'— kg'}</strong><p class="tag">${w?`${fmt(w.date)} · ${esc(w.time)}`:'Zatím není zapsané vážení.'}</p></div><button class="btn" data-action="new-weights">+ Zapsat hmotnost</button></div></div>`;}
function weightGraph(entries,goal=null){if(!entries.length)return '<div class="healthchartempty">Pro graf zatím chybí vážení v tomto období.</div>';let ys=entries.map(e=>e.kg);if(finite(goal,1,500))ys.push(goal);let low=Math.floor((Math.min(...ys)-.5)*10)/10,high=Math.ceil((Math.max(...ys)+.5)*10)/10,w=560,h=220,left=43,right=15,top=15,bottom=38,start=+new Date(weightTimestamp(entries[0])+':00'),end=+new Date(weightTimestamp(entries.at(-1))+':00');let x=e=>start===end?(left+w-right)/2:left+(+new Date(weightTimestamp(e)+':00')-start)/(end-start)*(w-left-right),y=kg=>top+(high-kg)/(high-low)*(h-top-bottom);let points=entries.map(e=>`${x(e)},${y(e.kg)}`).join(' ');return `<div class="weightgraph"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Vývoj zaznamenané hmotnosti v kg">${[0,.5,1].map(a=>{let kg=low+(high-low)*a;return `<line x1="${left}" x2="${w-right}" y1="${y(kg)}" y2="${y(kg)}" stroke="#303640" stroke-dasharray="3 4"/><text x="3" y="${y(kg)+3}">${num(kg,1)}</text>`;}).join('')}${finite(goal,1,500)?`<line x1="${left}" x2="${w-right}" y1="${y(goal)}" y2="${y(goal)}" stroke="#ff7547" stroke-dasharray="6 4"/>`:''}<polyline points="${points}" stroke="#8cbcff" stroke-width="2.5" fill="none"/>${entries.map(e=>`<g tabindex="0" role="button" data-chart="${esc(e.date+' '+e.time+' · '+num(e.kg,2)+' kg')}" aria-label="${esc(e.date+' '+e.time+' '+num(e.kg,2)+' kilogramů')}"><title>${esc(e.date)} ${esc(e.time)}: ${num(e.kg,2)} kg</title><circle cx="${x(e)}" cy="${y(e.kg)}" r="10" fill="transparent"/><circle cx="${x(e)}" cy="${y(e.kg)}" r="3.5" fill="#8cbcff"/></g>`).join('')}<text x="${left}" y="${h-12}">${fmt(entries[0].date,{day:'numeric',month:'numeric'})}</text><text x="${w-right}" y="${h-12}" text-anchor="end">${fmt(entries.at(-1).date,{day:'numeric',month:'numeric'})}</text></svg></div>`;}

function weightPage(){let from=add(today(),1-period),weights=weightHistory(from,today()),last=latestWeight(),wa=dailyWeightAverage(add(today(),-6),today()),goal=target(),goals=db.tournaments.filter(x=>x.date>=today()&&finite(x.targetWeight,1,500)).sort((a,b)=>a.date.localeCompare(b.date)),change=weights.length>1?weights.at(-1).kg-weights[0].kg:null;return head('Monitoring hmotnosti','Vážení, vývoj a váhové cíle turnajů.')+`<div class="healthtools">${btn('+ Zapsat hmotnost','new-weights','primary')}<div class="segmented">${[7,30,90,365].map(n=>`<button data-period="${n}" class="${period===n?'active':''}">${n===365?'1 rok':n+' dní'}</button>`).join('')}</div></div><div class="card"><div class="cardhead"><h2>Vývoj hmotnosti</h2>${badge('KG')}</div><div class="sleepbig"><strong>${last?num(last.kg,2):'—'} <span>kg</span></strong><span>${last?fmt(last.date)+' '+esc(last.time):'Chybí vážení'}</span></div><div class="miniline"><span class="tag">7denní průměr ${wa.average===null?'—':num(wa.average,2)+' kg'} · ${wa.days} dní s daty</span><span class="tag">${change===null?'Změna: málo dat':(change>0?'+':'')+num(change,2)+' kg v období'}</span></div>${weightGraph(weights,goal?.targetWeight)}<p class="formhint">Graf ukazuje skutečná vážení, bez doplňování chybějících dní. Denní průměry mají stejnou váhu v 7denním průměru.${goal?.targetWeight?` Oranžová čára: ${esc(goal.name)}, cíl ${num(goal.targetWeight,2)} kg.`:''}</p>${btn('Export vážení CSV','export-weights','small ghost')}</div><div class="grid half" style="margin-top:20px"><div class="card"><h2>Váhové cíle turnajů</h2>${goals.length?goals.map(t=>`<h3 style="margin-top:15px">${esc(t.name)}</h3>${weightGoalCard(t)}<button class="textbutton" data-edit="tournaments:${esc(t.id)}">Upravit kategorii nebo cíl</button>`).join(''):'<p class="muted">V detailu turnaje vyplň váhovou kategorii a cílovou hmotnost.</p>'}${btn('Otevřít turnaje','nav-tournaments','small ghost')}<p class="formhint" style="margin-top:13px">Rozdíl je porovnání s posledním vážením, ne doporučení tempa hubnutí. Krátkodobě hmotnost kolísá i podle vody.</p></div><div class="card"><h2>Historie vážení</h2>${weights.length?weights.slice().reverse().map(e=>`<button class="healthrow" data-edit="weights:${esc(e.id)}"><span><strong>${num(e.kg,2)} kg</strong><small>${esc(e.notes||'Bez poznámky')}</small></span><span class="tag">${fmt(e.date)} · ${esc(e.time)} ${icon('arrow',13)}</span></button>`).join(''):'<p class="muted">V tomto období žádná vážení.</p>'}</div></div>`;}

function trainingCsv(){let cell=x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"',rows=[['Datum','Trénink','Typ','Stav','Délka min','Celkové RPE','Cvik','Série','Hodnota série','Váha kg','Intenzita','Měřítko','Poznámka ke cviku','Poznámka k sérii','Poznámky k tréninku','Jednotka série']];for(const e of db.sessions){if(e.sets?.length){let per={};for(const x of e.sets){let key=x.groupId||x.exercise;per[key]=(per[key]||0)+1;rows.push([e.date,e.title,activityLabel(e),e.status,e.duration,e.rpe,x.exercise,per[key],x.reps,x.weight,x.effort??'',x.mode||'RPE',x.exerciseNotes||'',x.notes||'',e.notes||'',setUnits[setUnit(x)].short]);}}else rows.push([e.date,e.title,activityLabel(e),e.status,e.duration,e.rpe,'','','','','','','','',e.notes||'','']);}download('bjj-denik-v3.csv','\uFEFF'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}

function healthCsv(){let rows=[['Datum','Čas','Hmotnost kg','Poznámky'],...(db.weights||[]).slice().sort((a,b)=>weightTimestamp(a).localeCompare(weightTimestamp(b))).map(e=>[e.date,e.time,e.kg,e.notes||''])],cell=x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download(`bjj-vazeni-${today()}.csv`,'\uFEFF'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
let lastDate=today();setInterval(()=>{if(today()!==lastDate){if(!editing){lastDate=today();render();}}},30000);save();
</script><script src="app-v2.js"></script>
